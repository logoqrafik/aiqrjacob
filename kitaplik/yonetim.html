<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark"><title>Yönetim · Satır Arası</title>
<style>
body{margin:0;background:#0e0f1a;color:#eceaf6;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:22px 16px 60px}h1{font-size:26px;margin:6px 0 4px}p{color:rgba(236,234,246,.65);margin:0 0 16px}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px;color:rgba(236,234,246,.75)}
input,textarea{width:100%;box-sizing:border-box;padding:14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#eceaf6;font:inherit}
textarea{min-height:110px;resize:vertical}small{color:rgba(236,234,246,.5)}
button{width:100%;min-height:50px;margin-top:14px;border:0;border-radius:14px;font:700 16px inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,#5f63d6,#8d63cc,#c4678c);cursor:pointer}
button.alt{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}button:disabled{opacity:.6}
.box{margin-top:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.card{border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;margin-top:16px;background:rgba(255,255,255,.04)}
.prev b{display:block}.prev span{color:rgba(236,234,246,.75);font-size:14px}
</style></head><body><main>
<h1>Bildirim gönder</h1><p>Tüm abonelere tek seferlik mesaj.</p>
<label for="pw">Yönetici şifresi</label><input id="pw" type="password" autocomplete="current-password">
<button class="alt" id="cnt">Kaç kişi abone?</button>
<div class="box" id="info" hidden></div>
<label for="t">Başlık <small>(en çok 80 karakter)</small></label><input id="t" maxlength="80" placeholder="Bu haftanın alıntısı 📖">
<label for="b">Mesaj <small>(en çok 240 karakter)</small></label><textarea id="b" maxlength="240" placeholder="Kısa ve sıcak bir mesaj yaz"></textarea>
<label for="u">Açılacak sayfa</label><input id="u" value="/" placeholder="/ ya da /#raf">
<div class="card prev"><small>Önizleme</small><b id="pt">Başlık</b><span id="pb">Mesaj</span></div>
<button id="go">Herkese gönder</button>
<div class="box" id="res" hidden></div>
<script>
const $ = s => document.querySelector(s), out = (el, t) => { el.hidden = false; el.textContent = t; };
$('#pw').value = sessionStorage.getItem('ypw') || '';
const prev = () => { $('#pt').textContent = $('#t').value || 'Başlık'; $('#pb').textContent = $('#b').value || 'Mesaj'; }; ['#t', '#b'].forEach(s => $(s).addEventListener('input', prev));
async function call(body) { sessionStorage.setItem('ypw', $('#pw').value); const r = await fetch('/api/push-send', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value, ...body }) }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Hata (' + r.status + ')'); return d; }
$('#cnt').onclick = async () => { try { const d = await call({ action: 'count' }); out($('#info'), d.count + ' abone'); } catch (e) { out($('#info'), e.message); } };
$('#go').onclick = async () => {
  const t = $('#t').value.trim(), b = $('#b').value.trim(); if (!t || !b) return out($('#res'), 'Başlık ve mesaj yaz.');
  try { const c = await call({ action: 'count' }); if (!confirm(c.count + ' kişiye gönderilsin mi?\n\n' + t + '\n' + b)) return; } catch (e) { return out($('#res'), e.message); }
  $('#go').disabled = true;
  try { const d = await call({ title: t, body: b, url: $('#u').value.trim() || '/' }); out($('#res'), `Gönderildi: ${d.sent} kişi. Geçersiz olup silinen: ${d.gone}. Hata: ${d.failed}.`); } catch (e) { out($('#res'), e.message); }
  $('#go').disabled = false;
};
</script></main></body></html>
