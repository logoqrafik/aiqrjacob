<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Satır Arası</title>
  <meta name="theme-color" content="#0e0f1a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Satır Arası">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <main class="wrap">
    <header>
      <img class="logo" src="logo.svg" alt="Satır Arası logosu" width="84" height="84">
      <h1>Satır Arası</h1>
      <div class="finish"><span>Fınısh</span></div>
      <p id="hello" class="hello"></p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab on" role="tab" data-tab="quotes">💬 Alıntılar</button>
      <button class="tab" role="tab" data-tab="story">🎞️ Hikâye</button>
    </nav>

    <div id="tab-quotes">
      <section class="card search">
        <label class="photo" id="drop">
          <input type="file" id="file" accept="image/*" hidden>
          <span class="photo-ico" aria-hidden="true">📖</span>
          <span id="photoLabel">Kitabın fotoğrafını yükle</span>
          <img id="preview" alt="" hidden>
        </label>
        <div class="or"><span>ya da</span></div>
        <input id="title" placeholder="Kitap adı" autocomplete="off" enterkeyhint="search">
        <input id="author" placeholder="Yazar" autocomplete="off" enterkeyhint="search">
        <button id="go" class="go"><span>Alıntıları getir</span></button>
      </section>

      <section id="daily" class="daily"></section>
      <div id="recent" class="recent"></div>
      <div id="out"></div>
    </div>

    <div id="tab-story" hidden>
      <section class="card">
        <label class="photo" id="sdrop">
          <input type="file" id="sfile" accept="image/*" hidden>
          <span class="photo-ico" aria-hidden="true">📸</span>
          <span id="sLabel">Kitabın fotoğrafını yükle</span>
          <img id="spreview" alt="" hidden>
        </label>
        <div class="ask2">Ne durumdasın?</div>
        <div class="cats" id="sStatus">
          <button class="cchip c3 on" data-st="basladim">🌱 Başladım</button>
          <button class="cchip c4" data-st="okuyorum">📖 Okuyorum</button>
          <button class="cchip c0" data-st="bitirdim">✅ Bitirdim</button>
        </div>
        <div class="ask2">Düzen</div>
        <div class="cats" id="sLayout">
          <button class="cchip c1 on" data-ly="safe">🖼️ Kitap açıkta</button>
          <button class="cchip c2" data-ly="full">🌄 Tam ekran</button>
        </div>
        <div class="ask2">Hangi kitap? <span class="muted2">(isteğe bağlı)</span></div>
        <input id="stitle" placeholder="Kitap adı" autocomplete="off">
        <input id="sauthor" placeholder="Yazar" autocomplete="off">
        <button class="btn2 wide" id="sfetch">✨ Bu kitaptan alıntıları getir</button>
        <div class="ask2">Görselde hangi alıntılar olsun? <span class="muted2">(en fazla 3)</span></div>
        <div id="spick" class="spick"></div>
        <textarea id="scustom" placeholder="Ya da kendi cümleni yaz"></textarea>
        <button class="btn2 wide" id="saddc">➕ Bu cümleyi ekle</button>
        <button id="sgo" class="go"><span>Görseli hazırla</span></button>
      </section>
      <div id="sout"></div>
    </div>

    <p class="credit"></p>
  </main>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js?v=16"></script>
  <script src="daily.js?v=16"></script>
  <script src="app.js?v=16"></script>
  <script src="story.js?v=16"></script>
</body>
</html>
