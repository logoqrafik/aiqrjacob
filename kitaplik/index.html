<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Satır Arası</title>
  <meta name="theme-color" content="#4a1fa8">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Satır Arası">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <main class="wrap">
    <header>
      <div class="pill">✨ Kitaplardan alıntılar</div>
      <h1>Satır Arası</h1>
      <p id="hello" class="hello"></p>
    </header>

    <section class="card search">
      <label class="photo" id="drop">
        <input type="file" id="file" accept="image/*" hidden>
        <span class="photo-ico" aria-hidden="true">📖</span>
        <span id="photoLabel">Kitabın fotoğrafını yükle</span>
        <img id="preview" alt="" hidden>
      </label>
      <div class="or"><span>ya da</span></div>
      <input id="title" placeholder="Kitap adı" autocomplete="off">
      <input id="author" placeholder="Yazar" autocomplete="off">
      <button id="go" class="go"><span>Alıntıları getir</span></button>
    </section>

    <section id="daily" class="daily"></section>
    <div id="recent" class="recent"></div>
    <div id="out"></div>

    <p class="credit"></p>
  </main>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="daily.js"></script>
  <script src="app.js"></script>
</body>
</html>
