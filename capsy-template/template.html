<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<title>Capsy Studio Case Template</title>
<meta name="viewport" content="width=1080">
<style>
  :root{
    --red:#E94739; --purple:#4A287C;
    --bg:#0A0612; --bg2:#140B22;
    --ink:#FFFFFF; --muted:rgba(255,255,255,.58); --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  body{width:1080px;height:1920px;overflow:hidden;font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
  .canvas{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(900px 700px at 100% 0%, rgba(74,40,124,.55), transparent 65%),
      radial-gradient(800px 700px at 0% 100%, rgba(233,71,57,.20), transparent 65%),
      linear-gradient(180deg,var(--bg2),var(--bg));}
  /* Instagram Reels/Story safe zones: ~250px top, ~340px bottom */
  .safe{position:absolute;left:84px;right:84px;top:200px;bottom:300px;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{height:96px;width:auto;display:block}
  .tag{font-size:22px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    padding:14px 22px;border:1px solid var(--line);border-radius:100px}

  .head{margin-top:70px}
  .eyebrow{display:flex;align-items:center;gap:16px;font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
  .eyebrow:before{content:"";width:56px;height:4px;border-radius:4px;background:var(--red)}
  h1{margin-top:28px;font-size:92px;line-height:1.02;font-weight:800;letter-spacing:-.035em}
  h1 em{font-style:normal;background:linear-gradient(90deg,var(--red),#ff7a5c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:26px;font-size:30px;line-height:1.4;color:var(--muted);font-weight:400}

  .shot-wrap{margin-top:56px}
  .shot-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .live{display:flex;align-items:center;gap:10px}
  .live i{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 6px rgba(233,71,57,.18)}
  .shot{background:#fff;border-radius:26px;padding:22px 20px;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08),0 0 120px -30px rgba(74,40,124,.9)}
  /* Screenshot is only scaled uniformly to the card width — never cropped, stretched or edited */
  .shot img{display:block;width:100%;height:auto}

  .zoom{margin-top:26px;background:#fff;border-radius:26px;padding:22px 20px;position:relative;
    box-shadow:0 40px 90px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08),0 0 140px -30px rgba(233,71,57,.55)}
  .zoom .win{overflow:hidden;border-radius:6px}
  .zoom img{display:block;height:auto;max-width:none}
  .zoom .badge{position:absolute;top:-16px;left:28px;font-size:18px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:var(--red);color:#fff;padding:8px 16px;border-radius:100px}
  .metrics{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .m{padding:30px 28px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
  .m:first-child{background:linear-gradient(160deg,rgba(233,71,57,.22),rgba(233,71,57,.05));border-color:rgba(233,71,57,.45)}
  .m b{display:block;font-size:56px;line-height:1;font-weight:800;letter-spacing:-.03em}
  .m span{display:block;margin-top:14px;font-size:21px;line-height:1.3;color:var(--muted);font-weight:500}

  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:34px;border-top:1px solid var(--line)}
  .cta{font-size:30px;font-weight:700;letter-spacing:-.01em}
  .cta small{display:block;margin-top:6px;font-size:22px;font-weight:500;color:var(--muted)}
  .handle{font-size:26px;font-weight:600;padding:18px 30px;border-radius:100px;background:var(--purple);box-shadow:0 10px 30px -8px rgba(74,40,124,.9)}
</style>
</head>
<body>
<div class="canvas">
  <div class="safe">
    <div class="top">
      <img class="logo" src="assets/logo.webp" alt="Capsy Studio">
      <div class="tag" id="tag"></div>
    </div>

    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>

    <div class="shot-wrap">
      <div class="shot-label"><span class="live"><i></i><span id="shotLabel"></span></span><span id="client"></span></div>
      <div class="shot"><img id="img" alt=""></div>
      <div class="zoom"><span class="badge">Zoom</span><div class="win"><img id="zimg" alt=""></div></div>
    </div>

    <div class="metrics" id="metrics"></div>

    <div class="foot">
      <div class="cta" id="cta"></div>
      <div class="handle" id="handle"></div>
    </div>
  </div>
</div>

<script>
  // Everything below can be overridden via URL params: template.html?img=assets/ref-3.png&client=...&m1v=165&m1l=...
  const p = new URLSearchParams(location.search);
  const g = (k, d) => p.get(k) ?? d;
  const set = (id, v, html) => { const e = document.getElementById(id); html ? e.innerHTML = v : e.textContent = v; };

  set('tag',       g('tag', 'Case Study'));
  set('eyebrow',   g('eyebrow', 'Real nəticə'));
  set('title',     g('title', 'Reklam <em>nəticələrimiz</em>'), true);
  set('sub',       g('sub', 'Meta Ads hesabından olduğu kimi ekran görüntüsü.'));
  set('shotLabel', g('shotLabel', 'Meta Ads — real data'));
  set('client',    g('client', ''));
  set('cta',       g('cta', 'Sizin biznes üçün də eyni nəticə'), true);
  document.querySelector('.cta').insertAdjacentHTML('beforeend', '<small>' + g('ctaSub', 'DM-ə yazın — pulsuz analiz') + '</small>');
  set('handle',    g('handle', '@capsy.studio'));
  const src = g('img', 'assets/ref-3.png');
  document.getElementById('img').src = src;
  // Zoom = the same screenshot magnified (no crop of content, no edits). zs = scale, zx = horizontal pan 0-100 (%)
  const zi = document.getElementById('zimg'), win = zi.parentElement;
  const zs = parseFloat(g('zs', '2')), zx = parseFloat(g('zx', '55'));
  zi.src = src;
  zi.onload = () => {
    const W = win.clientWidth, w = W * zs;
    zi.style.width = w + 'px';
    zi.style.marginLeft = -((w - W) * zx / 100) + 'px';
  };
  if (g('zoom', '1') === '0') document.querySelector('.zoom').remove();

  const box = document.getElementById('metrics');
  for (let i = 1; i <= 3; i++) {
    const v = g('m' + i + 'v', ''), l = g('m' + i + 'l', '');
    if (!v) continue;
    box.insertAdjacentHTML('beforeend', '<div class="m"><b></b><span></span></div>');
    box.lastElementChild.querySelector('b').textContent = v;
    box.lastElementChild.querySelector('span').textContent = l;
  }
  if (!box.children.length) box.remove();
</script>
</body>
</html>
